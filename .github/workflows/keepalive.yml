name: Keep database awake

# Supabase pauses a free project after 7 days without activity. This makes one tiny
# database call every day (the public ping function) so the centre's data is always online.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o out.txt -w "%{http_code}" -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
            echo "HTTP $code $(cat out.txt)"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
