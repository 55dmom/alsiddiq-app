name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      live_check:
        description: "Run the end-to-end check against the real database (ONLY while it is empty, before the owner's first setup)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests
        run: gradle :app:testDebugUnitTest -PBUILD_NUMBER=${{ github.run_number }} --stacktrace 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: Assemble demo APK (sample data, used for screenshots)
        run: |
          mkdir -p out
          gradle :app:assembleDebug -PBUILD_NUMBER=${{ github.run_number }} --stacktrace 2>&1 | tee build-demo.log
          code=${PIPESTATUS[0]}; cp app/build/outputs/apk/debug/*.apk out/AlSiddiq-demo-${{ github.run_number }}.apk || true; exit $code
      - name: Assemble check APK (debug, real database, only for the manual live check)
        if: ${{ inputs.live_check }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          gradle :app:assembleDebug -PBUILD_NUMBER=${{ github.run_number }} \
            -PSUPABASE_URL="$SUPABASE_URL" -PSUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" --stacktrace 2>&1 | tee build-check.log
          code=${PIPESTATUS[0]}; cp app/build/outputs/apk/debug/*.apk out/AlSiddiq-check-${{ github.run_number }}.apk || true; exit $code
      - name: Assemble signed release APK connected to the central database
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
          gradle :app:assembleRelease -PBUILD_NUMBER=${{ github.run_number }} \
            -PSUPABASE_URL="$SUPABASE_URL" -PSUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}; rm -f "$RUNNER_TEMP/release.p12"; exit $code
      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/AlSiddiq-${{ github.run_number }}.apk || true
          ls app/build/outputs/apk/release/ || true
          grep -E "^e: |error:|FAILURE|BUILD SUCCESSFUL|BUILD FAILED" build-demo.log build.log test.log > out/errors.txt 2>/dev/null || true
          # Compiler errors as annotations, readable through the API without downloading artifacts.
          grep -hE "^e: |error:|What went wrong" -A2 build-demo.log build.log test.log 2>/dev/null | head -60 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done || true
          cp build-demo.log build.log test.log out/ 2>/dev/null || true
          ls -la out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: out/

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: if [ -f ci/QUICK_SHOTS ]; then bash ci/shots_quick.sh out/AlSiddiq-demo-${{ github.run_number }}.apk; else bash ci/shots.sh out/AlSiddiq-demo-${{ github.run_number }}.apk; fi && if [ "${{ inputs.live_check }}" = "true" ]; then bash ci/cloud_check.sh out/AlSiddiq-check-${{ github.run_number }}.apk; fi
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/

  release:
    needs: [build, screenshots]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -R art | head -60
          TAG=build-${{ github.run_number }}
          FILES="art/apk/AlSiddiq-${{ github.run_number }}.apk art/apk/AlSiddiq-demo-${{ github.run_number }}.apk"
          if [ -d art/screenshots ]; then
            cd art/screenshots && zip -q ../../screenshots.zip * && cd ../..
            FILES="$FILES screenshots.zip $(ls art/screenshots/*.png | tr '\n' ' ') $(ls art/screenshots/*.txt 2>/dev/null | tr '\n' ' ')"
          fi
          gh release create "$TAG" $FILES --repo "${{ github.repository }}" \
            --title "مركز الصديق — build ${{ github.run_number }}" \
            --notes "AlSiddiq-N.apk = the real app (signed release, connected to the central database). AlSiddiq-demo-N.apk = preview with sample data on the phone only. Commit ${{ github.sha }}." --prerelease
